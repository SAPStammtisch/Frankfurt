# Veröffentlicht die GitHub Page https://sapstammtisch.github.io/Frankfurt/
# bei jeder Änderung an README.md oder Bildern auf main.
name: Deploy Pages from main

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "*.jpeg"
      - "*.jpg"
      - "*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
