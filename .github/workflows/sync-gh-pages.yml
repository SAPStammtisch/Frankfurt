# Kopiert README.md und Bilder von main nach GH-Pages.
# Die Pages-Quelle bleibt "Deploy from a branch: GH-Pages", der vorhandene
# Workflow "pages build and deployment" veröffentlicht danach die Seite
# https://sapstammtisch.github.io/Frankfurt/
name: Sync main to GH-Pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "*.jpeg"
      - "*.jpg"
      - "*.png"
      - ".github/workflows/sync-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gh-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: GH-Pages
          path: pages
      - name: Inhalt von main nach GH-Pages kopieren
        run: rsync -a --delete --exclude '.git' --exclude '.github' main/ pages/
      - name: Committen und pushen
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Sync von main (${GITHUB_SHA::7})"
            git push origin HEAD:GH-Pages
          fi
